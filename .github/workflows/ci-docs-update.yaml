name: "CI: Terraform docs update"
on:
  - pull_request

permissions:
  contents: write

jobs:

  find-modules:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - id: set-matrix
        run: |
          dirs=$(find . -type f -name "*.tf" -exec dirname {} \; | sort -u | jq -R . | jq -s -c .)
          echo "matrix=$dirs" >> $GITHUB_OUTPUT

  docs:
    name: "docs update"
    runs-on: ubuntu-latest
    needs: find-modules
    strategy:
      matrix:
        dir: ${{ fromJson(needs.find-modules.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Update ${{ matrix.dir }} docs
        uses: terraform-docs/gh-actions@v1.4.1
        with:
          working-dir: ${{ matrix.dir }}
          git-push: true
